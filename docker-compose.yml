version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: django_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - web_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: django_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - web_net

  web:
    build: .
    container_name: django_web
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - DJANGO_SETTINGS_MODULE=myweb.settings.prod
      - DB_HOST=django_mysql
      - DB_PORT=3306
      - DB_NAME=${DB_NAME}
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=django_redis
      - REDIS_PORT=6379
      - SECRET_KEY=${SECRET_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - FEISHU_BOT_WEBHOOK=${FEISHU_BOT_WEBHOOK}
      - FEISHU_APP_ID=${FEISHU_APP_ID}
      - FEISHU_APP_SECRET=${FEISHU_APP_SECRET}
      - FEISHU_VERIFICATION_TOKEN=${FEISHU_VERIFICATION_TOKEN}
      - FEISHU_EVENT_REPLY_ENABLED=${FEISHU_EVENT_REPLY_ENABLED}
      - FEISHU_EVENT_TOKEN_CHECK_ENABLED=${FEISHU_EVENT_TOKEN_CHECK_ENABLED}
      - COZE_API=${COZE_API}
      - COZE_API_KEY=${COZE_API_KEY}
      - COZE_PROJECT_ID=${COZE_PROJECT_ID}
      - N8N_JOB_RECORD_WEBHOOK_URL=${N8N_JOB_RECORD_WEBHOOK_URL}
      - NOVEL_VIDEO_STORAGE_BACKEND=${NOVEL_VIDEO_STORAGE_BACKEND}
      - NOVEL_VIDEO_STORAGE_URL=${NOVEL_VIDEO_STORAGE_URL}
      - NOVEL_VIDEO_STORAGE_ENABLED=${NOVEL_VIDEO_STORAGE_ENABLED}
      - NOVEL_VIDEO_USER_STORAGE_LIMIT_BYTES=${NOVEL_VIDEO_USER_STORAGE_LIMIT_BYTES}
      - NOVEL_VIDEO_TOTAL_STORAGE_ALERT_BYTES=${NOVEL_VIDEO_TOTAL_STORAGE_ALERT_BYTES}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME}
      - R2_PUBLIC_BASE_URL=${R2_PUBLIC_BASE_URL}
      - R2_ENDPOINT_URL=${R2_ENDPOINT_URL}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - NOVEL_VIDEO_TTS_MAX_RETRIES=${NOVEL_VIDEO_TTS_MAX_RETRIES}
      - NOVEL_VIDEO_TTS_RETRY_DELAYS=${NOVEL_VIDEO_TTS_RETRY_DELAYS}
      - NOVEL_VIDEO_TTS_REQUEST_INTERVAL_SECONDS=${NOVEL_VIDEO_TTS_REQUEST_INTERVAL_SECONDS}
    volumes:
      - ./logs:/app/logs
      - ./media:/app/media
    networks:
      - web_net

  worker:
    build: .
    container_name: django_worker
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - DJANGO_SETTINGS_MODULE=myweb.settings.prod
      - DB_HOST=django_mysql
      - DB_PORT=3306
      - DB_NAME=${DB_NAME}
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=django_redis
      - REDIS_PORT=6379
      - SECRET_KEY=${SECRET_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - FEISHU_BOT_WEBHOOK=${FEISHU_BOT_WEBHOOK}
      - FEISHU_APP_ID=${FEISHU_APP_ID}
      - FEISHU_APP_SECRET=${FEISHU_APP_SECRET}
      - FEISHU_VERIFICATION_TOKEN=${FEISHU_VERIFICATION_TOKEN}
      - FEISHU_EVENT_REPLY_ENABLED=${FEISHU_EVENT_REPLY_ENABLED}
      - FEISHU_EVENT_TOKEN_CHECK_ENABLED=${FEISHU_EVENT_TOKEN_CHECK_ENABLED}
      - COZE_API=${COZE_API}
      - COZE_API_KEY=${COZE_API_KEY}
      - COZE_PROJECT_ID=${COZE_PROJECT_ID}
      - N8N_JOB_RECORD_WEBHOOK_URL=${N8N_JOB_RECORD_WEBHOOK_URL}
      - NOVEL_VIDEO_STORAGE_BACKEND=${NOVEL_VIDEO_STORAGE_BACKEND}
      - NOVEL_VIDEO_STORAGE_URL=${NOVEL_VIDEO_STORAGE_URL}
      - NOVEL_VIDEO_STORAGE_ENABLED=${NOVEL_VIDEO_STORAGE_ENABLED}
      - NOVEL_VIDEO_USER_STORAGE_LIMIT_BYTES=${NOVEL_VIDEO_USER_STORAGE_LIMIT_BYTES}
      - NOVEL_VIDEO_TOTAL_STORAGE_ALERT_BYTES=${NOVEL_VIDEO_TOTAL_STORAGE_ALERT_BYTES}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME}
      - R2_PUBLIC_BASE_URL=${R2_PUBLIC_BASE_URL}
      - R2_ENDPOINT_URL=${R2_ENDPOINT_URL}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - NOVEL_VIDEO_TTS_MAX_RETRIES=${NOVEL_VIDEO_TTS_MAX_RETRIES}
      - NOVEL_VIDEO_TTS_RETRY_DELAYS=${NOVEL_VIDEO_TTS_RETRY_DELAYS}
      - NOVEL_VIDEO_TTS_REQUEST_INTERVAL_SECONDS=${NOVEL_VIDEO_TTS_REQUEST_INTERVAL_SECONDS}
    command: celery -A myweb worker -l info --concurrency=1
    volumes:
      - ./logs:/app/logs
      - ./media:/app/media
    networks:
      - web_net

volumes:
  mysql_data:
  redis_data:

networks:
  web_net:
    external: true
